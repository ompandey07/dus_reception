{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dus Reception And Events</title>
    <link rel="manifest" href="{% static 'manifest.json' %}">
    <link rel="icon" type="image/png" href="{% static 'Logo/Logo.png' %}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Agbalumo&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Agbalumo', cursive;
            background: white;
        }
        
        .gradient-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
        }

        .logo-container img {
            width: 280px;
            height: 280px;
            object-fit: contain;
            display: block;
        }

        @media (max-width: 640px) {
            .logo-container img {
                width: 200px;
                height: 200px;
            }
        }


    </style>
</head>
<body>
    <!-- Main Content -->
    <section class="min-h-screen bg-white flex flex-col items-center justify-center px-4 sm:px-6 py-10 sm:py-20">
        <div class="max-w-5xl w-full text-center flex flex-col items-center">
            <!-- Logo -->
            <div class="mb-24 sm:mb-32">
                <div class="logo-container">
                    <img src="{% static 'Logo/Logo.png' %}" alt="Dus Logo">
                </div>
            </div>
            
            <!-- Get Started Button -->
            <div>
                <a href="{% url 'login' %}" class="inline-flex items-center justify-center bg-gradient-to-r from-purple-600 to-purple-800 text-white px-8 sm:px-16 py-4 sm:py-6 text-lg sm:text-xl lg:text-2xl font-semibold hover:shadow-2xl transition-all duration-300 hover:scale-105 w-full sm:w-auto max-w-sm">
                    <span>Get Started</span>
                </a>
            </div>
        </div>
    </section>
